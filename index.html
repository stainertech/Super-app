
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>EcoCash</title>
  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #0878d0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    button, input {
      font: inherit;
    }

    .app {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: linear-gradient(155deg, #0879d5, #0057b9);
    }

    .top-panel {
      position: relative;
      z-index: 1;
      padding: 30px 27px 45px;
      background: #fff;
      border-radius: 0 0 48% 9% / 0 0 8% 5%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 42px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 47px;
      height: 47px;
      border-radius: 15px;
      background: #0879d5;
      color: white;
      font-size: 25px;
      font-weight: 800;
    }

    .brand-name {
      color: #12375c;
      font-size: 23px;
      font-weight: 800;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: #8494a6;
      font-size: 11px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 10px;
      color: #163451;
      font-size: 32px;
      letter-spacing: -1px;
    }

    .intro {
      margin-bottom: 28px;
      color: #8794a3;
      font-size: 14px;
      line-height: 1.6;
    }

    .field-label {
      display: block;
      margin-bottom: 10px;
      color: #28445f;
      font-size: 13px;
      font-weight: 700;
    }

    .phone-field {
      display: flex;
      align-items: center;
      width: 100%;
      height: 57px;
      margin-bottom: 25px;
      padding: 0 13px;
      border: 1px solid #dfe7ef;
      border-radius: 13px;
      background: white;
    }

    .country {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-right: 12px;
      color: #243d55;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .country-divider {
      width: 1px;
      height: 26px;
      background: #e1e7ed;
    }

    .phone-field input {
      width: 100%;
      min-width: 0;
      padding-left: 12px;
      border: 0;
      outline: none;
      background: transparent;
      color: #193b5c;
      font-size: 15px;
    }

    .pin-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .pin-heading .field-label {
      margin-bottom: 0;
    }

    .lock-label {
      color: #0878d1;
      font-size: 12px;
      font-weight: 700;
    }

    .pin-boxes {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .pin-box {
      width: 100%;
      min-width: 0;
      height: 57px;
      border: 1px solid #dfe7ef;
      border-radius: 12px;
      outline: none;
      background: #f9fbfd;
      color: #123e65;
      text-align: center;
      font-size: 24px;
    }

    .pin-box:focus,
    .phone-field:focus-within {
      border-color: #1683dc;
      box-shadow: 0 0 0 3px rgba(22, 131, 220, .09);
    }

    .pin-note {
      margin-bottom: 24px;
      color: #94a0ad;
      font-size: 11px;
      line-height: 1.5;
    }

    .primary-button {
      width: 100%;
      height: 55px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(90deg, #087ed8, #0563c5);
      box-shadow: 0 8px 18px rgba(0, 103, 194, .16);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .register-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 22px;
      color: #8291a1;
      font-size: 13px;
    }

    .text-button {
      padding: 5px;
      border: 0;
      background: transparent;
      color: #0878d1;
      font-weight: 700;
      cursor: pointer;
    }

    .bottom-panel {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 155px;
      padding: 24px 25px max(24px, env(safe-area-inset-bottom));
      color: white;
      text-align: center;
    }

    .help-button {
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 22px;
      background: transparent;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .version {
      margin-top: 17px;
      color: rgba(255,255,255,.8);
      font-size: 11px;
    }

    .terms {
      margin-top: 8px;
      color: rgba(255,255,255,.75);
      font-size: 10px;
      line-height: 1.5;
    }

    .notice {
      display: none;
      margin-top: 12px;
      padding: 11px;
      border-radius: 9px;
      background: #eef6ff;
      color: #24557e;
      font-size: 12px;
      line-height: 1.5;
    }

    .notice.visible {
      display: block;
    }

    @media (max-height: 720px) {
      .top-panel {
        padding-top: 20px;
        padding-bottom: 30px;
      }

      .brand {
        margin-bottom: 24px;
      }

      h1 {
        font-size: 28px;
      }

      .intro {
        margin-bottom: 18px;
      }

      .phone-field {
        margin-bottom: 18px;
      }

      .pin-note {
        margin-bottom: 15px;
      }

      .bottom-panel {
        min-height: 120px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="top-panel">
      <header class="brand">
        <div class="brand-mark" aria-hidden="true">E</div>
        <div>
          <div class="brand-name">EcoCash</div>
          <div class="brand-subtitle">Mobile Money</div>
        </div>
      </header>

      <h1>Login</h1>
      <p class="intro">Welcome back. Enter your details to continue.</p>

      <form id="loginForm" autocomplete="off">
        <label class="field-label" for="phone">Mobile number</label>

        <div class="phone-field">
          <div class="country">
            <span aria-hidden="true">🇿🇼</span>
            <span>+263</span>
          </div>

          <div class="country-divider"></div>

          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            maxlength="12"
            placeholder="Phone number"
            aria-label="Phone number"
          >
        </div>

        <div class="pin-heading">
          <label class="field-label" for="pin1">Enter your PIN</label>
          <span class="lock-label">● Private</span>
        </div>

        <div class="pin-boxes">
          <input class="pin-box" id="pin1" type="password"
            inputmode="numeric" maxlength="1" aria-label="PIN digit 1">
          <input class="pin-box" id="pin2" type="password"
            inputmode="numeric" maxlength="1" aria-label="PIN digit 2">
          <input class="pin-box" id="pin3" type="password"
            inputmode="numeric" maxlength="1" aria-label="PIN digit 3">
          <input class="pin-box" id="pin4" type="password"
            inputmode="numeric" maxlength="1" aria-label="PIN digit 4">
        </div>

        <p class="pin-note">
          Visual interface only. Do not enter a real wallet PIN.
        </p>

        <button class="primary-button" type="submit">Login</button>

        <div class="notice" id="notice" role="status" aria-live="polite"></div>

        <div class="register-row">
          <span>New here?</span>
          <button class="text-button" id="registerButton" type="button">
            Register
          </button>
        </div>
      </form>
    </section>

    <footer class="bottom-panel">
      <button class="help-button" id="helpButton" type="button">
        Help &amp; Support
      </button>

      <p class="version">EcoCash UI · Version 1.0.0</p>
      <p class="terms">
        This is an independent visual interface and is not an official EcoCash service.
      </p>
    </footer>
  </main>

  <script>
    const pinInputs = [...document.querySelectorAll(".pin-box")];
    const phoneInput = document.getElementById("phone");
    const notice = document.getElementById("notice");

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add("visible");
    }

    pinInputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        input.value = input.value.replace(/\D/g, "").slice(0, 1);

        if (input.value && index < pinInputs.length - 1) {
          pinInputs[index + 1].focus();
        }
      });

      input.addEventListener("keydown", event => {
        if (event.key === "Backspace" && !input.value && index > 0) {
          pinInputs[index - 1].focus();
        }
      });
    });

    phoneInput.addEventListener("input", () => {
      phoneInput.value = phoneInput.value.replace(/\D/g, "");
    });

    document.getElementById("loginForm").addEventListener("submit", event => {
      event.preventDefault();
      showNotice("This visual interface is not connected to an EcoCash account.");
    });

    document.getElementById("registerButton").addEventListener("click", () => {
      showNotice("Registration is not connected in this interface.");
    });

    document.getElementById("helpButton").addEventListener("click", () => {
      showNotice("Please use the official EcoCash support channels for account help.");
      document.querySelector(".top-panel").scrollIntoView({
        behavior: "smooth",
        block: "end"
      });
    });
  </script>
</body>
</html>
