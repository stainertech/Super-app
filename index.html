
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0876d8">
<title>Mobile Wallet Login</title>
<style>
:root {
  --blue: #0876d8;
  --blue-deep: #0061d0;
  --outline: #397eb3;
  --text: #41494d;
}
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}
body {
  background: #fff;
}
.app {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: white;
}
.status {
  height: 31px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px;
  color: #555;
  font-size: 10px;
  background: white;
}
.top {
  position: relative;
  z-index: 2;
  flex: 0 0 54%;
  min-height: 340px;
  background: white;
  border-radius: 0 0 50% 50% / 0 0 10% 10%;
  padding: 0 20px;
  text-align: center;
}
.brand {
  font-size: 29px;
  font-weight: 750;
  letter-spacing: -.8px;
  padding-top: 2px;
  margin-bottom: 32px;
}
.brand .eco { color: #1767a9; }
.brand .cash { color: #c74747; }
h1 {
  font-size: 17px;
  color: var(--text);
  margin: 0 0 18px;
}
.phone-field {
  width: 100%;
  height: 44px;
  border: 1.5px solid var(--outline);
  border-radius: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 0 7px;
}
.flag { font-size: 19px; }
.arrow { color: #777; font-size: 10px; }
.dial-code {
  color: #667078;
  font-size: 12px;
  white-space: nowrap;
}
.phone-field input {
  width: 100%;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 13px;
}
.pin-label {
  font-size: 12px;
  color: #62686b;
  margin: 10px 0 21px;
}
.pin-fields {
  display: flex;
  justify-content: center;
  gap: 7px;
}
.pin-fields input {
  width: 33px;
  height: 38px;
  border: 1.5px solid var(--outline);
  border-radius: 6px;
  outline: none;
  background: white;
  text-align: center;
  font-size: 20px;
  padding: 0;
}
.pin-fields input:focus {
  border-color: var(--blue);
}
.feedback {
  font-size: 12px;
  color: #a32222;
  margin-top: 8px;
  min-height: 14px;
}
.bottom {
  flex: 1 1 auto;
  min-height: 0;
  margin-top: -1px;
  background: linear-gradient(150deg, var(--blue), var(--blue-deep));
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 20px 20px calc(30px + env(safe-area-inset-bottom));
}
.helper {
  font-size: 11px;
  line-height: 1.5;
  text-align: center;
  margin-bottom: 19px;
}
.actions {
  width: 100%;
  display: flex;
  gap: 10px;
}
.action {
  flex: 1;
  height: 58px;
  border: 0;
  border-radius: 9px;
  background: #f7f7f4;
  color: #60686b;
  font-size: 10px;
  cursor: pointer;
}
.action-icon {
  display: block;
  font-size: 19px;
  font-weight: bold;
  color: var(--blue);
  margin-bottom: 4px;
}
.version {
  font-size: 10px;
  margin-top: 38px;
  margin-bottom: 8px;
}
.terms {
  text-align: center;
  font-size: 10px;
  color: #e5f0ff;
  line-height: 1.5;
}
.terms a {
  color: inherit;
  text-decoration: underline;
}
.nav {
  position: absolute;
  z-index: 5;
  left: 50%;
  bottom: max(6px, env(safe-area-inset-bottom));
  transform: translateX(-50%);
  width: 95px;
  height: 3px;
  border-radius: 4px;
  background: white;
}
@media (max-height: 680px) {
  .top {
    flex-basis: 56%;
    min-height: 0;
  }
  .brand { margin-bottom: 17px; }
  .pin-label { margin: 8px 0 12px; }
  .bottom {
    padding-top: 12px;
    padding-bottom: 24px;
  }
  .version { margin-top: 15px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="status">
    <span id="clock">2:04</span>
    <span>● ▴ ▰ 70%</span>
  </div>

  <section class="top">
    <div class="brand">
      <span class="eco">Eco</span><span class="cash">Cash</span>
    </div>

    <h1>Login</h1>

    <label class="phone-field">
      <span class="flag">🇿🇼</span>
      <span class="arrow">▼</span>
      <span class="dial-code">+263</span>
      <input id="phone" type="tel" inputmode="numeric"
        maxlength="9" placeholder="Phone Number"
        aria-label="Demo phone number">
    </label>

    <div class="pin-label">Enter your PIN</div>

    <div class="pin-fields">
      <input type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 1">
      <input type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 2">
      <input type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 3">
      <input type="password" inputmode="numeric" maxlength="1" aria-label="PIN digit 4">
    </div>
    <div id="feedback" class="feedback"></div>
  </section>

  <section class="bottom">
    <div class="helper">
      To register a mobile wallet or get assistance,<br>
      click below
    </div>

    <div class="actions">
      <button class="action" id="register">
        <span class="action-icon">♟</span>
        Register
      </button>
      <button class="action" id="support">
        <span class="action-icon">●</span>
        Help &amp; Support
      </button>
    </div>

    <div class="version">Wallet UI Prototype</div>
    <div class="terms">
      Prototype sign-in interface.<br>
      Do not enter real account credentials.
    </div>
  </section>

  <div class="nav"></div>
</div>

<script>
const phone = document.getElementById('phone');
const feedback = document.getElementById('feedback');
const pins = [...document.querySelectorAll('.pin-fields input')];

pins.forEach((input, index) => {
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(-1);
    feedback.textContent = '';

    if (input.value && index < pins.length - 1) {
      pins[index + 1].focus();
    }

    if (pins.every(pin => pin.value.length === 1)) {
      feedback.textContent =
        'Prototype only. No account authentication is performed.';
    }
  });

  input.addEventListener('keydown', event => {
    if (event.key === 'Backspace' &&
        !input.value && index > 0) {
      pins[index - 1].focus();
    }
  });
});

document.getElementById('register').addEventListener('click', () => {
  feedback.textContent = 'Registration is not configured in this prototype.';
});

document.getElementById('support').addEventListener('click', () => {
  feedback.textContent = 'Support is not configured in this prototype.';
});

phone.addEventListener('input', () => {
  phone.value = phone.value.replace(/\D/g, '').slice(0, 9);
});

</script>
</body>
</html>
